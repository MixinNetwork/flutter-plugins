name: Windows WebView

on:
  pull_request:
    paths:
      - 'packages/desktop_webview_window/**'
      - '.github/workflows/windows-webview.yml'
  push:
    paths:
      - 'packages/desktop_webview_window/**'
      - '.github/workflows/windows-webview.yml'

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Configure fake media devices for WebView2
        run: |
          # Elevated CI processes ignore WEBVIEW2_* environment overrides.
          $key = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'webview_window_example.exe' -Value '--use-fake-device-for-media-stream' -PropertyType String -Force | Out-Null
      - name: Test Windows WebView2 behavior
        working-directory: packages/desktop_webview_window/example
        run: flutter test integration_test/windows_webview_test.dart -d windows --timeout 5m
