name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      package:
        description: "package"
        required: true
        type: choice
        options:
          - ogg_opus_player
          - mixin_logger
          - desktop_webview_window
          - desktop_drop
          - desktop_keep_screen_on
          - desktop_lifecycle
          - fts5_simple
          - win_toast
          - pasteboard
          - desktop_multi_window
          - mixin_markdown_widget
          - breakpad_client
          - word_segmenter
  push:
    tags:
      - 'ogg_opus_player-v[0-9]+.[0-9]+.[0-9]+*'
      - 'mixin_logger-v[0-9]+.[0-9]+.[0-9]+*'
      - 'desktop_webview_window-v[0-9]+.[0-9]+.[0-9]+*'
      - 'desktop_drop-v[0-9]+.[0-9]+.[0-9]+*'
      - 'desktop_keep_screen_on-v[0-9]+.[0-9]+.[0-9]+*'
      - 'desktop_lifecycle-v[0-9]+.[0-9]+.[0-9]+*'
      - 'fts5_simple-v[0-9]+.[0-9]+.[0-9]+*'
      - 'win_toast-v[0-9]+.[0-9]+.[0-9]+*'
      - 'pasteboard-v[0-9]+.[0-9]+.[0-9]+*'
      - 'desktop_multi_window-v[0-9]+.[0-9]+.[0-9]+*'
      - 'mixin_markdown_widget-v[0-9]+.[0-9]+.[0-9]+*'
      - 'breakpad_client-v[0-9]+.[0-9]+.[0-9]+*'
      - 'word_segmenter-v[0-9]+.[0-9]+.[0-9]+*'
jobs:
  publish:

    name: 'Publish to pub.dev'
    environment: 'pub.dev'
    permissions:
      id-token: write # This is required for requesting the JWT
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pub skips gitignored files but warns when they are tracked, which
      # third-party submodules such as Breakpad do. Untrack them in this
      # checkout so validation matches the published contents.
      - name: Untrack ignored submodule files
        run: git submodule foreach --quiet --recursive 'git ls-files -ci --exclude-standard -z | xargs -0 -r git rm --cached -q'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter --version

      # Setup Dart SDK with JWT token
      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c

      - name: Install workspace dependencies
        run: dart pub get

      # Parse package from tag, e.g.: ogg_opus_player-v1.0.0
      - name: Parse package name
        id: parse
        uses: actions/github-script@v6
        with:
          result-encoding: string
          script: |
            const fs = require('fs')
            let packageName = context.payload.inputs?.package
            let tagVersion
            if (context.ref.startsWith('refs/tags/')) {
              const tag = context.ref.replace('refs/tags/', '')
              const match = /^([a-z][a-z0-9_]*)-v(\d+\.\d+\.\d+)$/.exec(tag)
              if (!match) throw new Error(`Invalid release tag: ${tag}`)
              packageName = match[1]
              tagVersion = match[2]
            }
            if (!/^[a-z][a-z0-9_]*$/.test(packageName ?? '')) {
              throw new Error('Missing or invalid package name')
            }
            const pubspec = fs.readFileSync(`packages/${packageName}/pubspec.yaml`, 'utf8')
            const name = /^name:\s*(\S+)/m.exec(pubspec)?.[1]
            const version = /^version:\s*(\S+)/m.exec(pubspec)?.[1]
            if (name !== packageName || (tagVersion && version !== tagVersion)) {
              throw new Error(`Release mismatch: tag=${context.ref}, pubspec=${name}@${version}`)
            }
            console.log(`Validated ${name}@${version}`)
            return packageName

      - name: Publish - dry run
        run: flutter pub publish --dry-run
        working-directory: 'packages/${{ steps.parse.outputs.result }}'

      # Publishing...
      - name: Publish to pub.dev
        run: flutter pub publish -f
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        working-directory: 'packages/${{ steps.parse.outputs.result }}'
