name: desktop_drop
resolution: workspace
description: Receive files, text, and URLs with per-target drag acceptance in Flutter applications.
version: 0.8.4
homepage: https://github.com/MixinNetwork/flutter-plugins/tree/main/packages/desktop_drop

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: DesktopDropPlugin
      linux:
        pluginClass: DesktopDropPlugin
      windows:
        pluginClass: DesktopDropPlugin
      android:
        package: one.mixin.desktop.drop
        pluginClass: DesktopDropPlugin
      web:
        pluginClass: DesktopDropWeb
        fileName: desktop_drop_web.dart
