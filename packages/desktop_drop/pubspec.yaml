name: desktop_drop
resolution: workspace
description: Receive files, text, and URLs with per-target drag acceptance in Flutter applications.
version: 0.9.1
homepage: https://github.com/MixinNetwork/flutter-plugins/tree/main/packages/desktop_drop

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  cross_file: ^0.4.0
  cross_file_platform_interface: ^1.0.0
  cross_file_web: ^1.0.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  mime: ^2.0.0
  web: ^1.1.1

dev_dependencies:
  cross_file_io: ^1.0.0
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: DesktopDropPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: DesktopDropPlugin
        sharedDarwinSource: true
      linux:
        pluginClass: DesktopDropPlugin
      windows:
        pluginClass: DesktopDropPlugin
      android:
        package: one.mixin.desktop.drop
        pluginClass: DesktopDropPlugin
      web:
        pluginClass: DesktopDropWeb
        fileName: desktop_drop_web.dart
